name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Install Capacitor Packages
      run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/filesystem @capacitor/local-notifications

    # 1. إعادة إنشاء مجلد الأندرويد من الصفر لضمان وجود build.gradle
    - name: Recreate Android Platform
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android
        echo "--- محتويات مجلد android/app ---"
        ls -la android/app

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platforms;android-36 build-tools;36.0.0'

    # 2. البحث عن build.gradle وتعديله
    - name: Add PAG Native Library
      run: |
        GRADLE_FILE=$(find android -name "build.gradle" -path "*/app/*" | head -n 1)
        if [ -z "$GRADLE_FILE" ]; then
          echo "❌ لم يتم العثور على build.gradle"
          exit 1
        fi
        echo "✅ تم العثور على build.gradle في: $GRADLE_FILE"
        sed -i '/repositories {/a\        mavenCentral()' $GRADLE_FILE
        sed -i "/dependencies {/a\    implementation 'com.tencent.tav:libpag:latest.release'" $GRADLE_FILE

    # 3. تنظيف وإضافة الصلاحيات
    - name: Clean and Add Permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        awk '!seen[$0]++' $MANIFEST > temp && mv temp $MANIFEST
        sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' $MANIFEST

    # 4. إجبار Kotlin على نسخة موحدة
    - name: Fix Kotlin Duplicate Classes
      run: |
        cd android
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } }" >> build.gradle

    # 5. إعطاء صلاحية التنفيذ (أو التجاهل لو الملف مش موجود)
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew || true

    # 6. البناء
    - name: Build APK with Gradle
      run: cd android && ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ezo-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
