name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    # 1. تثبيت Capacitor بشكل عام
    - name: Install Capacitor CLI Globally
      run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

    # 2. إنشاء ملف الإعدادات من الصفر عشان نتجاوز مشكلة الـ appId
    - name: Init Capacitor
      run: npx cap init "Ezo Group" com.ezo.app --web-dir=dist

    # 3. إضافة منصة الأندرويد
    - name: Add Android Platform
      run: npx cap add android

    # 4. مزامنة الملفات
    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK with Gradle
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ezo-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
