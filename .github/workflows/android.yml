name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Install Capacitor Packages
      run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/filesystem @capacitor/local-notifications

    # التأكد من وجود المجلد، وإنشاؤه إذا لزم، ثم عمل sync
    - name: Ensure Android Platform
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platforms;android-36 build-tools;36.0.0'

    # 1. تنظيف وإضافة الصلاحيات بدون تكرار
    - name: Clean and Add Permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # إزالة أي سطر مكرر
        awk '!seen[$0]++' $MANIFEST > temp && mv temp $MANIFEST
        # إضافة الصلاحيات الناقصة
        sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' $MANIFEST

    # 2. إضافة مستودع Maven ومكتبة PAG الأصلية بالطريقة الصحيحة
    - name: Add PAG Native Library
      run: |
        GRADLE_FILE="android/app/build.gradle"
        # إضافة mavenCentral إلى repositories
        sed -i '/repositories {/a\        mavenCentral()' $GRADLE_FILE
        # إضافة المكتبة إلى dependencies
        sed -i "/dependencies {/a\    implementation 'com.tencent.tav:libpag:latest.release'" $GRADLE_FILE

    # 3. إجبار Kotlin على نسخة واحدة لتجنب التكرار
    - name: Fix Kotlin Duplicate Classes
      run: |
        cd android
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } }" >> build.gradle

    # 4. إعطاء الصلاحية (أو التجاهل لو الملف مش موجود)
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew || true

    # 5. البناء النهائي
    - name: Build APK with Gradle
      run: cd android && ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ezo-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
