name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Install Capacitor Packages
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Init Capacitor
      run: npx cap init "Ezo Group" com.ezo.app --web-dir=dist

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # هذا هو الحل: نجبر Gradle يستخدم نسخة موحدة من Kotlin
    - name: Fix Kotlin Duplicate Classes
      run: |
        cd android
        echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } }" >> build.gradle
        echo "تم تعديل build.gradle بنجاح"

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK with Gradle
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ezo-App-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
